<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Console</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding: 10px; transition: background 0.08s ease; margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; box-sizing: border-box; }
        .container { width: 100%; max-width: 320px; padding: 15px; background: rgba(0,0,0,0.75); border-radius: 12px; backdrop-filter: blur(10px); box-sizing: border-box; }
        h1 { font-size: 18px; margin: 0 0 5px 0; color: #ff5252; }
        p { font-size: 11px; color: #aaa; margin: 0 0 12px 0; }
        button { padding: 16px 20px; font-size: 16px; margin: 5px 0; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; width: 100%; background: #ff5252; color: white; }
        #status { font-size: 14px; margin: 8px 0; color: #ff5252; font-weight: bold; }
        .admin-panel { background: #1a1a1a; border: 1px dashed #ff5252; padding: 12px; border-radius: 8px; margin-top: 5px; text-align: left; font-size: 12px; width: 100%; box-sizing: border-box; }
        label { display: block; margin-bottom: 4px; color: #bbb; }
        input[type="range"], select, input[type="number"] { width: 100%; margin-bottom: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px; border-radius: 4px; box-sizing: border-box; }
        #debugLog { background: #000; color: #00ffcc; padding: 6px; text-align: left; font-family: monospace; border-radius: 6px; margin-top: 10px; font-size: 9px; max-height: 60px; overflow-y: auto; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Matrix Master Console</h1>
        <p>Configure classroom matrix engine and test hardware feeds live.</p>
        
        <button id="startBtn">Activate Master Console</button>
        <div id="status">Offline</div>

        <div class="admin-panel">
            <label>Strobe Flash Color:</label>
            <select id="colorSelect">
                <option value="#00ffcc" selected>Neon Cyan</option>
                <option value="#ff0055">Neon Pink</option>
                <option value="#9900ff">Neon Purple</option>
                <option value="#ff9900">Neon Orange</option>
                <option value="#00ff00">Neon Green</option>
                <option value="#ffffff">Pure White</option>
            </select>

            <label>Ultrasonic Command Pitch (Hz):</label>
            <input type="number" id="ultraFreqInput" value="17500" min="15000" max="22000" step="100">

            <label>Music Beat Sensitivity: <span id="sensVal">15</span></label>
            <input type="range" id="sensSlider" min="5" max="40" step="1" value="15">

            <label>Flash Duration: <span id="durVal">80</span>ms</label>
            <input type="range" id="durSlider" min="30" max="500" step="10" value="80">

            <label>Double-Beat Lockout Window: <span id="lockVal">330</span>ms</label>
            <input type="range" id="lockSlider" min="150" max="600" step="10" value="330">
        </div>
        
        <div id="debugLog">System tracking active...</div>
    </div>

    <script>
        let audioContext, analyser, track = null, lastBeatTime = 0, energyHistory = [];
        const HISTORY_MAX = 30;

        let activeColor = "#00ffcc", beatSensitivity = 15, flashDuration = 80, doubleBeatLockout = 330, targetUltraFreq = 17500;
        const ULTRA_TOLERANCE = 300, ULTRA_THRESHOLD = -66;

        document.getElementById('sensSlider').addEventListener('input', (e) => { beatSensitivity = parseInt(e.target.value); document.getElementById('sensVal').innerText = beatSensitivity; });
        document.getElementById('durSlider').addEventListener('input', (e) => { flashDuration = parseInt(e.target.value); document.getElementById('durVal').innerText = flashDuration; });
        document.getElementById('lockSlider').addEventListener('input', (e) => { doubleBeatLockout = parseInt(e.target.value); document.getElementById('lockVal').innerText = doubleBeatLockout; });
        document.getElementById('colorSelect').addEventListener('change', (e) => { activeColor = e.target.value; });
        document.getElementById('ultraFreqInput').addEventListener('change', (e) => { targetUltraFreq = parseInt(e.target.value); });

        function log(msg) {
            const logBox = document.getElementById('debugLog');
            logBox.innerHTML += "<br>> " + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser(); analyser.fftSize = 512;
                audioContext.createMediaStreamSource(audioStream).connect(analyser);
                setInterval(processAudioStreams, 20);
            } catch (err) { log("Mic error: " + err.message); }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                track = stream.getVideoTracks()[0]; // IPHONE HARDWARE FIX
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('status').innerText = "Console Active";
            } catch (err) { 
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('status').innerText = "Screen Strobe Only";
            }
        });

        function processAudioStreams() {
            if (!analyser) return;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            const sampleRate = audioContext.sampleRate, binSize = sampleRate / analyser.fftSize, now = Date.now();

            let instantBassEnergy = 0, bassBinsLimit = 4;
            for (let i = 0; i < bassBinsLimit; i++) { instantBassEnergy += dataArray[i]; }
            instantBassEnergy = instantBassEnergy / bassBinsLimit;

            let historySum = 0;
            for (let i = 0; i < energyHistory.length; i++) { historySum += energyHistory[i]; }
            let averageBassEnergy = energyHistory.length > 0 ? (historySum / energyHistory.length) : 100;

            const floatData = new Float32Array(analyser.frequencyBinCount);
            analyser.getFloatFrequencyData(floatData);
            const ultraLowBin = Math.floor((targetUltraFreq - ULTRA_TOLERANCE) / binSize), ultraHighBin = Math.ceil((targetUltraFreq + ULTRA_TOLERANCE) / binSize);
            let maxUltraVolume = -Infinity;
            for (let i = ultraLowBin; i <= ultraHighBin; i++) { if (floatData[i] > maxUltraVolume) maxUltraVolume = floatData[i]; }

            let frameTrigger = false;
            if (instantBassEnergy > (averageBassEnergy + beatSensitivity) && (now - lastBeatTime > doubleBeatLockout)) { frameTrigger = true; }
            if (maxUltraVolume > ULTRA_THRESHOLD && (now - lastBeatTime > doubleBeatLockout)) { frameTrigger = true; log("Ultrasonic pulse recognized!"); }

            if (frameTrigger) { lastBeatTime = now; executeLightSequence(); }
            energyHistory.push(instantBassEnergy);
            if (energyHistory.length > HISTORY_MAX) { energyHistory.shift(); }
        }

        function executeLightSequence() {
            document.body.style.background = activeColor;
            setTorchState(true);
            setTimeout(() => { setTorchState(false); document.body.style.background = "#121212"; }, flashDuration);
        }

        async function setTorchState(turnOn) {
            if (!track) return;
            try { await track.applyConstraints({ advanced: [{ torch: turnOn }] }); } catch (e) {}
        }
    </script>
</body>
</html>
