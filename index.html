<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrasonic Flashlight</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding: 15px; }
        button { padding: 20px 40px; font-size: 20px; margin: 15px 0; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 100%; max-width: 300px; }
        #startBtn { background: #00e676; color: black; }
        #status { font-size: 22px; margin: 15px 0; color: #00e676; font-weight: bold; }
        .control-panel { background: #1e1e1e; padding: 15px; border-radius: 10px; margin: 15px auto; max-width: 350px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        #debugLog { background: #000; color: #ff5252; padding: 15px; text-align: left; font-family: monospace; border-radius: 8px; margin-top: 20px; font-size: 11px; max-height: 180px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>Ultrasonic Flashlight</h1>
    <p>1. Tap Activate. 2. Broadcast a silent 17.5 kHz wave from a second device.</p>
    
    <button id="startBtn">1. Click to Activate</button>
    <div id="status">Status: Offline</div>

    <div class="control-panel">
        <label>Target Frequency: <strong>17,500 Hz (Inaudible)</strong></label>
        <label>Current Volume Spike at Target: <span id="liveVolume">-100</span> dB</label>
    </div>
    
    <h3 style="color:#666; margin-bottom: 5px;">System Diagnostics:</h3>
    <div id="debugLog">System ready. Waiting for tap...</div>

    <script>
        let audioContext, analyser, track = null, flashlightOn = false, lastTriggerTime = 0;
        
        // Ultrasonic Targets
        const TARGET_FREQ = 17500;
        const FREQ_TOLERANCE = 300; 
        const THRESHOLD_DB = -68; // Boosted sensitivity to catch faint ultrasonic waves

        function log(msg) {
            const logBox = document.getElementById('debugLog');
            logBox.innerHTML += "<br>> " + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            log("Configuring ultrasonic listeners...");
            document.getElementById('status').innerText = "Requesting permissions...";

            try {
                // Request mic with raw processing to disable iOS echo filters
                const audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: false,
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                });
                log("Unfiltered Microphone stream established.");
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048; // High resolution frequency separation
                audioContext.createMediaStreamSource(audioStream).connect(analyser);
                
                setInterval(analyzeAudio, 50);
            } catch (err) {
                log("MIC REJECTION: " + err.message);
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                track = stream.getVideoTracks();
                log("Rear Camera stream active.");
                
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('status').innerText = "🤫 SILENTLY LISTENING...";
            } catch (err) {
                log("CAMERA REJECTION: " + err.message);
                document.getElementById('status').innerText = "System Blocked.";
            }
        });

        function analyzeAudio() {
            if (!analyser) return;
            const dataArray = new Float32Array(analyser.frequencyBinCount);
            analyser.getFloatFrequencyData(dataArray);
            
            const sampleRate = audioContext.sampleRate;
            const binSize = sampleRate / analyser.fftSize;
            
            const lowBin = Math.floor((TARGET_FREQ - FREQ_TOLERANCE) / binSize);
            const highBin = Math.ceil((TARGET_FREQ + FREQ_TOLERANCE) / binSize);

            let maxVolume = -Infinity;
            for (let i = lowBin; i <= highBin; i++) {
                if (dataArray[i] > maxVolume) maxVolume = dataArray[i];
            }

            // Update live volume display on screen
            if (maxVolume !== -Infinity) {
                document.getElementById('liveVolume').innerText = Math.round(maxVolume);
            }

            const now = Date.now();
            if (maxVolume > THRESHOLD_DB && (now - lastTriggerTime > 1500)) {
                lastTriggerTime = now;
                log(`Ultrasonic wave detected at 17.5kHz (${Math.round(maxVolume)}dB)!`);
                toggleFlashlight();
            }
        }

        async function toggleFlashlight() {
            if (!track || track.length === 0) return;
            flashlightOn = !flashlightOn;
            try {
                await track[0].applyConstraints({ advanced: [{ torch: flashlightOn }] });
                document.getElementById('status').innerText = `Torch: ${flashlightOn ? 'ON' : 'OFF'}`;
                log("Hardware Torch state flipped successfully.");
            } catch (e) {
                log("TORCH DISALLOWED: Make sure your battery is charged above 20%!");
            }
        }
    </script>
</body>
</html>
