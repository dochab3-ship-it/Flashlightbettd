<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Flashlight</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding: 20px; }
        button { padding: 20px 40px; font-size: 20px; margin: 20px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; }
        #startBtn { background: #00e676; color: black; }
        #status { font-size: 18px; margin-top: 20px; color: #00e676; font-weight: bold; }
        #debugLog { background: #000; color: #ff5252; padding: 15px; text-align: left; font-family: monospace; border-radius: 8px; margin-top: 30px; font-size: 12px; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>Audio Flashlight Trigger</h1>
    <p>Step 1: Tap the button. Step 2: Play a high tone to toggle light.</p>
    
    <button id="startBtn">1. Click to Activate</button>
    <div id="status">Status: Offline</div>
    
    <h3 style="margin-top:40px; color:#666;">System Diagnostics:</h3>
    <div id="debugLog">System initialized. Waiting for tap...</div>

    <script>
        let audioContext, analyser, track = null, flashlightOn = false, lastTriggerTime = 0;
        const TARGET_FREQ = 15000, FREQ_TOLERANCE = 500, THRESHOLD_DB = -55;

        function log(msg) {
            const logBox = document.getElementById('debugLog');
            logBox.innerHTML += "<br>> " + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('startBtn').addEventListener('click', async () => {
            log("Button clicked. Starting security check...");
            document.getElementById('status').innerText = "Requesting permissions...";

            // Fix 1: Request Mic FIRST
            try {
                log("Requesting Microphone access...");
                const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                log("Microphone access GRANTED.");
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                audioContext.createMediaStreamSource(audioStream).connect(analyser);
                setInterval(analyzeAudio, 50);
            } catch (err) {
                log("MIC ERROR: " + err.name + " - " + err.message);
            }

            // Fix 2: Request Camera SECOND with looser environmental constraints
            try {
                log("Requesting Rear Camera/Flashlight access...");
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                track = stream.getVideoTracks()[0];
                log("Camera access GRANTED.");
                
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('status').innerText = "🎉 LISTENING LIVE!";
            } catch (err) {
                log("CAMERA ERROR: " + err.name + " - " + err.message);
                document.getElementById('status').innerText = "Permission Denied or Blocked.";
            }
        });

        function analyzeAudio() {
            if (!analyser) return;
            const dataArray = new Float32Array(analyser.frequencyBinCount);
            analyser.getFloatFrequencyData(dataArray);
            const binSize = audioContext.sampleRate / analyser.fftSize;
            
            const lowBin = Math.floor((TARGET_FREQ - FREQ_TOLERANCE) / binSize);
            const highBin = Math.ceil((TARGET_FREQ + FREQ_TOLERANCE) / binSize);

            let maxVolume = -Infinity;
            for (let i = lowBin; i <= highBin; i++) {
                if (dataArray[i] > maxVolume) maxVolume = dataArray[i];
            }

            const now = Date.now();
            if (maxVolume > THRESHOLD_DB && (now - lastTriggerTime > 1200)) {
                lastTriggerTime = now;
                log("Frequency match detected at " + TARGET_FREQ + "Hz! Toggling light...");
                toggleFlashlight();
            }
        }

        async function toggleFlashlight() {
            if (!track) {
                log("Toggle failed: No camera track available.");
                return;
            }
            flashlightOn = !flashlightOn;
            try {
                await track.applyConstraints({ advanced: [{ torch: flashlightOn }] });
                document.getElementById('status').innerText = `Flashlight turned: ${flashlightOn ? 'ON' : 'OFF'}`;
                log("Hardware torch modified successfully.");
            } catch (e) {
                log("TORCH API ERROR: Your specific browser/OS mix blocks web flashlight control.");
            }
        }
    </script>
</body>
</html>
