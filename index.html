<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classroom Music Sync</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; padding: 15px; transition: background 0.1s ease; margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .container { max-width: 400px; padding: 20px; background: rgba(0,0,0,0.6); border-radius: 16px; backdrop-filter: blur(10px); }
        button { padding: 20px 40px; font-size: 20px; margin: 15px 0; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; width: 100%; background: #00e676; color: black; }
        #status { font-size: 24px; margin: 15px 0; color: #00e676; font-weight: bold; text-shadow: 0 0 10px rgba(0,230,118,0.5); }
        .control-panel { background: #1e1e1e; padding: 15px; border-radius: 10px; margin: 15px auto; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 14px; }
        input[type="range"] { width: 100%; margin-bottom: 10px; }
        #debugLog { background: #000; color: #ff5252; padding: 10px; text-align: left; font-family: monospace; border-radius: 8px; margin-top: 20px; font-size: 11px; max-height: 100px; overflow-y: auto; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Classroom Music Sync</h1>
        <p>Tap activate and place near the music speaker to join the synchronized light show.</p>
        
        <button id="startBtn">Join Light Show</button>
        <div id="status">Status: Offline</div>

        <div class="control-panel">
            <label>Beat Sensitivity: <span id="sensVal">15</span></label>
            <input type="range" id="sensSlider" min="5" max="40" step="1" value="15">
        </div>
        
        <div id="debugLog">Rhythm system ready...</div>
    </div>

    <script>
        let audioContext, analyser, track = null;
        let lastBeatTime = 0;
        let beatSensitivity = 15; 
        let energyHistory = [];
        const HISTORY_MAX = 30;

        // Bright neon color palette for the background transitions
        const colors = ["#ff0055", "#00ffcc", "#9900ff", "#ff9900", "#00ff00", "#ff00ff", "#ffff00"];

        function log(msg) {
            const logBox = document.getElementById('debugLog');
            logBox.innerHTML += "<br>> " + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('sensSlider').addEventListener('input', (e) => {
            beatSensitivity = parseInt(e.target.value);
            document.getElementById('sensVal').innerText = beatSensitivity;
        });

        document.getElementById('startBtn').addEventListener('click', async () => {
            log("Syncing listening arrays...");
            try {
                const audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } 
                });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512; 
                audioContext.createMediaStreamSource(audioStream).connect(analyser);
                
                setInterval(detectBeat, 20);
            } catch (err) { log("Mic sync block: " + err.message); }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                track = stream.getVideoTracks();
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('status').innerText = "🕺 SYNCED TO ROOM!";
                log("Hardware matrix operational.");
            } catch (err) { 
                log("Camera restricted. Screen show active."); 
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('status').innerText = "📺 SCREEN SYNC ACTIVE!";
            }
        });

        function detectBeat() {
            if (!analyser) return;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);
            
            let instantBassEnergy = 0;
            const bassBinsLimit = 8; // Monitors 40Hz - 150Hz
            
            for (let i = 0; i < bassBinsLimit; i++) {
                instantBassEnergy += dataArray[i];
            }
            instantBassEnergy = instantBassEnergy / bassBinsLimit;

            let historySum = 0;
            for (let i = 0; i < energyHistory.length; i++) {
                historySum += energyHistory[i];
            }
            let averageBassEnergy = energyHistory.length > 0 ? (historySum / energyHistory.length) : 100;

            const now = Date.now();

            // FIXED: Added 330ms lockout window to step cleanly over rapid double-beats
            if (instantBassEnergy > (averageBassEnergy + beatSensitivity) && (now - lastBeatTime > 330)) {
                lastBeatTime = now;
                
                // Color show transition
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                document.body.style.background = randomColor;
                setFlashlight(true);
                
                setTimeout(() => {
                    setFlashlight(false);
                    document.body.style.background = "#121212";
                }, 80);
            }

            energyHistory.push(instantBassEnergy);
            if (energyHistory.length > HISTORY_MAX) {
                energyHistory.shift();
            }
        }

        async function setFlashlight(turnOn) {
            if (!track || track.length === 0) return;
            try {
                await track[0].applyConstraints({ advanced: [{ torch: turnOn }] });
            } catch (e) {}
        }
    </script>
</body>
</html>
